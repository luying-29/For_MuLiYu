<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 专属星空许愿 ✨</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #050510; /* 深邃星空蓝黑 */
            overflow: hidden;
            font-family: 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: url('https://cdn-icons-png.flaticon.com/32/1005/1005111.png'), auto;
        }

        /* 天灯与星空的画布 */
        #skyCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI交互层 */
        #ui-layer {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        /* 点亮按钮 */
        #lightBtn {
            background: transparent;
            color: #ffdf85;
            border: 2px solid #ffdf85;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.5s ease;
            box-shadow: 0 0 20px rgba(255, 223, 133, 0.4), inset 0 0 10px rgba(255, 223, 133, 0.2);
            letter-spacing: 2px;
        }

        #lightBtn:hover {
            background: rgba(255, 223, 133, 0.1);
            box-shadow: 0 0 30px rgba(255, 223, 133, 0.8), inset 0 0 20px rgba(255, 223, 133, 0.5);
            transform: scale(1.05);
        }

        /* 琉璃发光许愿卡 (Glassmorphism) */
        #wishCard {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 0 40px rgba(255, 154, 158, 0.3), inset 0 0 20px rgba(255, 223, 133, 0.2);
            opacity: 0;
            transform: translateY(50px);
            transition: all 2s ease;
        }

        #wishCard.show {
            display: block;
        }

        #wishCard.fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        .title {
            font-size: 28px;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #ffdf85);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .message {
            font-size: 16px;
            line-height: 2;
            color: #f1f2f6;
            margin-bottom: 30px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* 会呼吸的许愿星 */
        .wishing-star {
            font-size: 40px;
            animation: starPulse 2s infinite alternate;
        }

        @keyframes starPulse {
            0% { text-shadow: 0 0 10px #ffdf85, 0 0 20px #ffdf85; transform: scale(1); }
            100% { text-shadow: 0 0 30px #ffdf85, 0 0 50px #ff9a9e; transform: scale(1.1); }
        }

    </style>
</head>
<body>

    <!-- 绘制天灯与星星的画布 -->
    <canvas id="skyCanvas"></canvas>

    <div id="ui-layer">
        <!-- 初始的交互按钮 -->
        <button id="lightBtn">✨ 点亮 24 岁的星空 ✨</button>

        <!-- 最终的许愿卡片 -->
        <div id="wishCard">
            <div class="wishing-star">🌟</div>
            <div class="title">I See The Light</div>
            <div class="message">
                你看，这些升空的天灯，<br>
                就像迪士尼童话里的魔法，<br>
                也像同福客栈屋顶上那一带而过的流星。<br><br>
                愿你前方的路，永远有光照亮；<br>
                愿你保持热忱，永远做自己人生的女主角。<br><br>
                <b>穆李宇，闭上眼睛，许个愿吧！</b>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('skyCanvas');
        const ctx = canvas.getContext('2d');
        const lightBtn = document.getElementById('lightBtn');
        const wishCard = document.getElementById('wishCard');

        let width, height;
        let lanterns = [];
        let stars = [];
        let animationActive = false;

        // 调整画布尺寸
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 星星类 (背景闪烁)
        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5;
                this.blinkSpeed = Math.random() * 0.02 + 0.01;
                this.alpha = Math.random();
            }
            draw() {
                this.alpha += this.blinkSpeed;
                if(this.alpha > 1 || this.alpha < 0) this.blinkSpeed *= -1;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(this.alpha)})`;
                ctx.fill();
            }
        }

        // 天灯类 (核心粒子特效)
        class Lantern {
            constructor() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 500; // 从屏幕下方开始
                this.size = Math.random() * 15 + 8;
                this.speedY = Math.random() * 1.5 + 0.5;
                // 粉色与黄色的交织
                const colors = ['255, 223, 133', '255, 154, 158', '254, 202, 87', '255, 184, 184'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.wobble = Math.random() * Math.PI * 2; // 左右摇摆
                this.opacity = Math.random() * 0.5 + 0.3;
            }
            update() {
                this.y -= this.speedY;
                this.wobble += 0.02;
                this.x += Math.sin(this.wobble) * 0.8; // 随风飘动的轨迹

                // 飞出屏幕后，从底下重新生成
                if (this.y < -50) {
                    this.y = height + 50;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.shadowBlur = 20;
                ctx.shadowColor = `rgb(${this.color})`;
                ctx.fillStyle = `rgb(${this.color})`;
                
                // 绘制天灯形状 (椭圆)
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, this.size * 0.7, this.size, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // 天灯底部的火焰高光
                ctx.beginPath();
                ctx.arc(this.x, this.y + this.size*0.4, this.size*0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();

                ctx.restore();
            }
        }

        // 初始化背景星星
        for(let i = 0; i < 150; i++) stars.push(new Star());

        // 动画主循环
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // 永远绘制背景星空
            stars.forEach(star => star.draw());

            // 只有点击按钮后，天灯才开始升空
            if (animationActive) {
                // 缓慢增加天灯数量，直到100个
                if(lanterns.length < 100 && Math.random() < 0.1) {
                    lanterns.push(new Lantern());
                }
                lanterns.forEach(lantern => {
                    lantern.update();
                    lantern.draw();
                });
            }
            requestAnimationFrame(animate);
        }
        animate();

        // 交互逻辑：点击点亮
        lightBtn.addEventListener('click', () => {
            animationActive = true;
            
            // 按钮淡出
            lightBtn.style.opacity = '0';
            
            setTimeout(() => {
                lightBtn.style.display = 'none';
                
                // 许愿卡浮现
                wishCard.classList.add('show');
                setTimeout(() => {
                    wishCard.classList.add('fade-in');
                }, 100);
            }, 500);
        });

    </script>
</body>
</html>
